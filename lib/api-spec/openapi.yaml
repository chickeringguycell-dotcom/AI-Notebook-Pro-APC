openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: notes
    description: Note pad operations
  - name: aether
    description: Aether AI chat, image, and audio operations
  - name: storage
    description: Object storage upload and serving endpoints
  - name: account
    description: Current user account status and Pro entitlement
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List all notes
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a new note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteBody"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a note by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteBody"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /aether/conversations:
    get:
      operationId: listAetherConversations
      tags: [aether]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AetherConversation"
    post:
      operationId: createAetherConversation
      tags: [aether]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAetherConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AetherConversation"
  /aether/conversations/{id}:
    get:
      operationId: getAetherConversation
      tags: [aether]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AetherConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AetherError"
    delete:
      operationId: deleteAetherConversation
      tags: [aether]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AetherError"
  /aether/conversations/{id}/messages:
    get:
      operationId: listAetherMessages
      tags: [aether]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AetherMessage"
    post:
      operationId: sendAetherMessage
      tags: [aether]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAetherMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /aether/scan-image:
    post:
      operationId: scanImageText
      tags: [aether]
      summary: Extract text from a photo using vision OCR
      description: Accepts a base64-encoded image and returns the extracted plain text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanImageBody'
      responses:
        '200':
          description: Extracted text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanImageResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AetherError'
        '500':
          description: Recognition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AetherError'
  /aether/polish-text:
    post:
      operationId: polishText
      tags: [aether]
      summary: Clean up dictated text — fix obvious mishearings and add punctuation
      description: Takes raw dictated text and returns a cleaned version with proper punctuation, capitalization, and sensible word corrections. Preserves the user's voice and meaning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolishTextBody'
      responses:
        '200':
          description: Cleaned text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolishTextResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AetherError'
        '500':
          description: Polish failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AetherError'
  /aether/conversations/{id}/voice-messages:
    post:
      operationId: sendAetherVoiceMessage
      tags: [aether]
      summary: Send audio and receive a streaming voice response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAetherVoiceMessageBody"
      responses:
        "200":
          description: SSE stream of transcript and audio chunks
          content:
            text/event-stream: {}
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageError"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageError"
  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageError"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageError"
  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the current user's account status
      responses:
        "200":
          description: Account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /pro/redeem:
    post:
      operationId: redeemPro
      tags: [account]
      summary: Redeem an invite code (or migrate a legacy local unlock) to enable Pro on the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemProBody"
      responses:
        "200":
          description: Pro status after redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Note:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        category:
          type: string
        paperTheme:
          type: string
        lineStyle:
          type: string
        inkColor:
          type: string
        font:
          type: string
        pinned:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - category
        - paperTheme
        - lineStyle
        - inkColor
        - font
        - pinned
        - createdAt
        - updatedAt
    CreateNoteBody:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        category:
          type: string
        paperTheme:
          type: string
        lineStyle:
          type: string
        inkColor:
          type: string
        font:
          type: string
        pinned:
          type: boolean
      required:
        - title
        - content
    UpdateNoteBody:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        category:
          type: string
        paperTheme:
          type: string
        lineStyle:
          type: string
        inkColor:
          type: string
        font:
          type: string
        pinned:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AetherConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    AetherMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    CreateAetherConversationBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    SendAetherMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    ScanImageBody:
      type: object
      required: [image, contentType]
      properties:
        image:
          type: string
          minLength: 1
          description: 'Base64-encoded image data, no data prefix'
        contentType:
          type: string
          minLength: 1
          description: 'MIME type of the image such as image/jpeg'
    ScanImageResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string
    PolishTextBody:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: Raw dictated text to clean up
        context:
          type: string
          description: 'Optional surrounding text for context (helps disambiguate words)'
    PolishTextResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string
    SendAetherVoiceMessageBody:
      type: object
      properties:
        audio:
          type: string
          description: Base64-encoded audio data
      required:
        - audio
    AetherConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AetherMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    AetherError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file.
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    StorageError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MeResponse:
      type: object
      required: [isPro]
      properties:
        isPro:
          type: boolean
    RedeemProBody:
      type: object
      properties:
        code:
          type: string
          description: Invite code to redeem.
        legacy:
          type: boolean
          description: When true, migrate a pre-existing local (device-only) unlock onto the account.
