<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>My AI Notebook '26</title>

    <!-- PWA meta tags -->
    <meta name="description" content="Your personal AI-powered notepad: voice dictation with AI cleanup, scan-to-text OCR, AI writing assistant, smart markdown paste, inline photos, sections & pinning, 26 languages." />
    <meta name="theme-color" content="#7c5c3e" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="My AI Notebook '26" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3" />

    <!-- Standard icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png?v=3" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Pirata+One&family=Dancing+Script:wght@500;700&family=Caveat:wght@500;700&family=Special+Elite&family=Playfair+Display:wght@500;700&family=Lobster&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="loading-fallback" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#f5efe6;flex-direction:column;font-family:Inter,sans-serif;color:#7c5c3e;">
        <div style="font-size:1.5rem;font-weight:600;margin-bottom:8px;">My AI Notebook</div>
        <div style="font-size:0.9rem;opacity:0.7;" id="loading-msg">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(function() {
        var msg = document.getElementById("loading-msg");
        if (msg && document.getElementById("loading-fallback")) {
          msg.textContent = "Taking longer than usual…";
          msg.insertAdjacentHTML("afterend",
            '<button onclick="clearCachesAndReload()" style="margin-top:16px;padding:10px 24px;background:#7c5c3e;color:#fff;border:none;border-radius:8px;font-size:0.95rem;cursor:pointer;">Tap to reload</button>'
          );
        }
      }, 6000);
      function clearCachesAndReload() {
        if ("caches" in window) {
          caches.keys().then(function(names) {
            return Promise.all(names.map(function(n) { return caches.delete(n); }));
          }).then(function() {
            if (navigator.serviceWorker) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
                location.reload();
              });
            } else { location.reload(); }
          });
        } else { location.reload(); }
      }
    </script>
  </body>
</html>
