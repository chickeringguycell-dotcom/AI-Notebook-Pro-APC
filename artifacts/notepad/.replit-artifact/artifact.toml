kind = "web"
previewPath = "/"
title = "AI Notepad"
version = "1.0.0"
id = "artifacts/notepad"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25507

[services.development]
run = "pnpm --filter @workspace/notepad run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/notepad", "run", "build" ]
publicDir = "artifacts/notepad/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25507"
BASE_PATH = "/"
