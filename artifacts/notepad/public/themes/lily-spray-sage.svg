<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <g id="petal-lg"><path d="M0 0 C -7 -18, -14 -38, -16 -52 C -8 -45, -3 -32, 0 -25 C 3 -32, 8 -45, 16 -52 C 14 -38, 7 -18, 0 0 Z" fill="#fef8ee" stroke="#b89868" stroke-width="1.3" stroke-linejoin="round"/></g>
    <g id="petal-md"><path d="M0 0 C -6 -15, -11 -32, -13 -42 C -6 -36, -2 -26, 0 -20 C 2 -26, 6 -36, 13 -42 C 11 -32, 6 -15, 0 0 Z" fill="#fef8ee" stroke="#b89868" stroke-width="1.1" stroke-linejoin="round"/></g>
  </defs>
  <g opacity="0.55">
    <!-- main flowing S stem -->
    <path d="M30 310 C 70 260, 95 235, 135 218 S 185 180, 205 138 C 220 108, 225 70, 218 32" stroke="#8aa67a" stroke-width="2.2" stroke-linecap="round"/>
    <!-- secondary stem -->
    <path d="M135 218 C 100 200, 70 200, 50 222 C 42 240, 52 254, 72 250 C 88 246, 88 232, 78 226" stroke="#8aa67a" stroke-width="1.6" stroke-linecap="round"/>
    <!-- baroque curls -->
    <path d="M205 138 C 235 128, 256 144, 254 170 C 250 188, 230 192, 222 178 C 218 168, 228 160, 236 164" stroke="#8aa67a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M218 60 C 244 46, 264 58, 270 80 C 270 100, 250 106, 244 94 C 240 84, 250 78, 258 82" stroke="#8aa67a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M75 285 C 50 280, 30 290, 28 312 C 50 296, 80 296, 96 282 Z" fill="#a8c498"/>
    <path d="M120 240 C 96 226, 70 234, 60 252 C 88 246, 110 250, 124 240 Z" fill="#a8c498" opacity="0.9"/>
    <path d="M158 195 C 178 175, 200 178, 218 196 C 190 190, 168 196, 158 206 Z" fill="#a8c498" opacity="0.9"/>
    <path d="M205 105 C 226 90, 250 96, 260 114 C 232 102, 215 110, 208 120 Z" fill="#a8c498"/>
    <path d="M222 32 C 240 18, 260 26, 264 44 C 246 32, 232 40, 224 50 Z" fill="#a8c498" opacity="0.85"/>
    <!-- veins -->
    <path d="M62 300 L 90 290" stroke="#7a9668" stroke-width="0.7" opacity="0.6"/>
    <path d="M88 248 L 116 244" stroke="#7a9668" stroke-width="0.7" opacity="0.6"/>
    <path d="M174 196 L 200 192" stroke="#7a9668" stroke-width="0.7" opacity="0.6"/>
    <!-- LILY 1 (large) -->
    <g transform="translate(150 222)">
      <use href="#petal-lg"/>
      <use href="#petal-lg" transform="rotate(72)"/>
      <use href="#petal-lg" transform="rotate(144)"/>
      <use href="#petal-lg" transform="rotate(216)"/>
      <use href="#petal-lg" transform="rotate(288)"/>
      <line x1="0" y1="0" x2="0" y2="-15" stroke="#c89640" stroke-width="1" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-7" y2="-13" stroke="#c89640" stroke-width="1" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="7" y2="-13" stroke="#c89640" stroke-width="1" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-4" y2="-15" stroke="#c89640" stroke-width="1" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="4" y2="-15" stroke="#c89640" stroke-width="1" stroke-linecap="round"/>
      <circle cx="0" cy="-15" r="1.6" fill="#c89640"/>
      <circle cx="-7" cy="-13" r="1.5" fill="#c89640"/>
      <circle cx="7" cy="-13" r="1.5" fill="#c89640"/>
      <circle cx="-4" cy="-15" r="1.5" fill="#c89640"/>
      <circle cx="4" cy="-15" r="1.5" fill="#c89640"/>
      <circle cx="0" cy="0" r="4" fill="#e8b850"/>
    </g>
    <!-- LILY 2 (medium, upper, tilted) -->
    <g transform="translate(218 38) rotate(28)">
      <use href="#petal-md"/>
      <use href="#petal-md" transform="rotate(72)"/>
      <use href="#petal-md" transform="rotate(144)"/>
      <use href="#petal-md" transform="rotate(216)"/>
      <use href="#petal-md" transform="rotate(288)"/>
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#c89640" stroke-width="0.9" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-5" y2="-11" stroke="#c89640" stroke-width="0.9" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="5" y2="-11" stroke="#c89640" stroke-width="0.9" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="#e8b850"/>
    </g>
    <!-- LILY 3 (bud, lower-left) -->
    <g transform="translate(72 244) rotate(-15)">
      <ellipse cx="0" cy="-2" rx="6" ry="14" fill="#fef8ee" stroke="#b89868" stroke-width="1" transform="rotate(-22)"/>
      <ellipse cx="0" cy="-2" rx="6" ry="14" fill="#fef8ee" stroke="#b89868" stroke-width="1" transform="rotate(22)"/>
      <ellipse cx="0" cy="-3" rx="4.2" ry="13" fill="#fef8ee" stroke="#b89868" stroke-width="0.9"/>
    </g>
  </g>
</svg>
